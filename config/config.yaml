# =============================================================================
# Morphyard configuration
#
# Values may reference environment variables:
#   ${VAR}           required - startup fails when it is unset
#   ${VAR:-default}  optional - falls back to the default
# =============================================================================

server:
  host: "${SERVER_HOST:-0.0.0.0}"
  port: ${SERVER_PORT:-5055}
  transport: "http"

# Bearer tokens are verified against MCP Gate's JWKS (RS256, offline after the first fetch).
# `base_url` is the address this server is reached at; the token audience is derived from it
# (`<base_url>/mcp`) and must equal what MCP Gate registered for this service.
# Set AUTH_ENABLED=false only for local experiments.
auth:
  enabled: ${AUTH_ENABLED:-true}
  issuer: "${MCP_GATE_URL:-http://localhost:4568}"
  base_url: "${MORPHYARD_BASE_URL:-http://127.0.0.1:5055}"
  required_scopes: []
  # MCP Gate revocation feed: without it a token revoked in MCP Gate keeps working here
  # until it expires. Needs a confidential client bound to this server in MCP Gate
  # (docs/configuration.md -> "Token revocation"). The secret must stay an ${ENV_VAR} reference.
  revocation:
    enabled: ${MORPHYARD_REVOCATION_ENABLED:-false}
    client_id: "${MORPHYARD_REVOCATION_CLIENT_ID:-}"
    client_secret: "${MORPHYARD_REVOCATION_CLIENT_SECRET:-}"
    poll_interval_sec: ${MORPHYARD_REVOCATION_POLL_INTERVAL:-30}   # a revocation takes effect within about this long
    fail_mode: "${MORPHYARD_REVOCATION_FAIL_MODE:-open}"          # open | closed (reject all tokens when the feed is stale)
    stale_after_intervals: 4                                   # "stale" = no successful poll for 4 x poll_interval_sec

logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "colorized"
  file: "logs/app.log"
  max_size: "10MB"
  backup_count: 3

app:
  name: "Morphyard"
  title: "Morphyard"
  description: "Document conversion MCP server: Office, PDF, Markdown, HTML, spreadsheets, presentations and images, plus PDF split / extract / rotate / encrypt."

convert:
  max_input_mb: ${MAX_INPUT_MB:-50}         # per-file limit
  engine_timeout_sec: ${ENGINE_TIMEOUT:-}    # seconds per engine call; empty = each engine's default (LibreOffice 180, Pandoc 120, OCR 300)
  max_hops: 3                               # longest multi-hop conversion path (overrides registry.MAX_HOPS)
  # Conversions beyond the limit wait in a first-in, first-out queue; when it is full, a new one is
  # refused as busy (MCP tool error). Tool calls run as jobs and wait in the queue without
  # queue_timeout_sec (jobs.max_sec bounds them); the timeout applies to other callers only.
  max_concurrent_conversions: ${MORPHYARD_MAX_CONCURRENT_CONVERSIONS:-}   # empty = CPUs available, at most 8
  max_queued_conversions: ${MORPHYARD_MAX_QUEUED_CONVERSIONS:-}           # empty = 4 x the limit; 0 = no queue
  queue_timeout_sec: ${MORPHYARD_QUEUE_TIMEOUT:-30}                       # longest wait for a slot, seconds

# Files kept on the server for a short time (results now; uploads and job outputs later),
# handed out as signed download links: <public_url>/files/<id>/<name>?exp=...&sig=...
# Anyone holding a link can download the file until it expires. When a cap is reached, new
# files are refused; files that have not expired are never deleted to make room.
files:
  data_dir: "${MORPHYARD_DATA_DIR:-./data}"               # store + generated signing key (Docker: /app/data volume)
  public_url: "${MORPHYARD_PUBLIC_URL:-}"                  # empty = MORPHYARD_BASE_URL
  signing_key: "${MORPHYARD_SIGNING_KEY:-}"                # empty = generated once into <data_dir>/.signing_key
  ttl_sec: ${MORPHYARD_FILE_TTL_SEC:-3600}                 # how long a file is kept, at most 86400 (24 h)
  max_total_mb: ${MORPHYARD_STORE_MAX_MB:-2048}            # whole store
  max_per_owner_mb: ${MORPHYARD_STORE_OWNER_MAX_MB:-512}   # per person (token `sub`)
  sweep_interval_sec: 60                                   # expired files are deleted this often and at startup
  result_delivery: "${MORPHYARD_RESULT_DELIVERY:-auto}"    # auto | inline | both | link
  inline_max_mb: ${MORPHYARD_INLINE_MAX_MB:-10}            # auto: files up to this size also come back as base64

# Conversions run as jobs: a call waits up to wait_sec, then answers with a job id that
# job_status / job_cancel / job_list reach. Jobs are kept in memory (a restart loses them; files
# already kept stay until they expire). A finished job is kept as long as its files (ttl_sec).
jobs:
  wait_sec: ${MORPHYARD_JOB_WAIT_SEC:-20}                 # wait in a call (and per job_status) before answering, at most 120
  max_per_owner: ${MORPHYARD_MAX_JOBS_PER_OWNER:-5}       # jobs queued or running at once per person (everyone, without auth)
  max_active: ${MORPHYARD_MAX_JOBS:-64}                   # jobs queued or running at once on the server
  max_sec: ${MORPHYARD_JOB_MAX_SEC:-1800}                 # a job is stopped after this long, queue wait included

modules:
  enabled:
    - morphyard

  morphyard:
    mcp_tools:
      module: "src.fastmcp_tools.morphyard_tools"
      function_name: "register_morphyard_tools"
